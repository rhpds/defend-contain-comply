spec:
  title: "Defend, Contain, Comply"
  learning_objectives:
    - "Implement automated CVE detection and containment by integrating Splunk alerts with Event-Driven Ansible rulebooks"
    - "Build policy-gated remediation workflows in AAP using OPA policies as execution gates and approval nodes"
    - "Deploy end-to-end compliance pipelines that audit systems against CIS benchmarks, apply hardening, and generate HTML compliance reports"
    - "Create hardened container images from UBI9-minimal with OpenSCAP scanning and push them to a local registry"
    - "Automate multi-step vulnerability response workflows that combine firewall isolation, service hardening, SELinux enforcement, and AIDE integrity monitoring"
  modules:
    - id: module-01
      title: "DEFEND: Detect and Contain"
      duration_min: 40
      status: not_started
    - id: module-02
      title: "CONTAIN: Policy-Gated Remediation"
      duration_min: 40
      status: not_started
    - id: module-03
      title: "COMPLY: Audit, Harden, Deliver"
      duration_min: 45
      status: not_started
