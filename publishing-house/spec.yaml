project:
  slug: defend-contain-comply
  owner_email: nmartins@redhat.com
  content_type: lab
  deployment_mode: rhdp_published
  initiative_key: rh1_2027
  showroom_type: zero_touch
  intake_type: migration
  automation_type: ansible
  description: 'A hands on lab that takes you through a vulnerability response orchestrated
    and managed by Ansible Automation Platform. '
  jira_ticket: RHDPCD-1153
  workflow_id: 62544834-1a7c-425b-a073-252ff68a2dd3
spec:
  title: Defend, Contain, Comply
  learning_objectives:
  - Implement automated CVE detection and containment by integrating Splunk alerts
    with Event-Driven Ansible rulebooks
  - Build policy-gated remediation workflows in AAP using OPA policies as execution
    gates and approval nodes
  - Deploy end-to-end compliance pipelines that audit systems against CIS benchmarks,
    apply hardening, and generate HTML compliance reports
  - Create hardened container images from UBI9-minimal with OpenSCAP scanning and
    push them to a local registry
  - Automate multi-step vulnerability response workflows that combine firewall isolation,
    service hardening, SELinux enforcement, and AIDE integrity monitoring
  modules:
  - id: module-01
    title: 'Module 1: DEFEND — Detect and Contain'
    duration_min: 40
    status: completed
  - id: module-02
    title: 'Module 2: CONTAIN — Patch and Enforce'
    duration_min: 40
    status: completed
  - id: module-03
    title: 'Module 3: COMPLY — Audit, Harden, Deliver'
    duration_min: 45
    status: completed
