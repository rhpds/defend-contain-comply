---
# DCC QA — reusable service-health checks.
# Refactored verbatim out of healthcheck.yml so both healthcheck.yml (periodic,
# non-destructive) and e2e.yml can share one definition of "is the environment up".
#
# Expects these vars from the including play (healthcheck.yml defines them):
#   hc_connect_timeout, hc_http_timeout, hc_validate_certs, hc_ca_path,
#   hc_containers, hc_ports, hc_endpoints
# Runs on the bastion (central) with become: true. Reads state only.
# Appends any problems to hc_failures; the caller asserts on it.

- name: Initialise failure list
  ansible.builtin.set_fact:
    hc_failures: []

- name: Verify SSH connectivity
  ansible.builtin.ping:

# ── Containers on central ────────────────────────────────────────────────
- name: Check container run state
  ansible.builtin.command:
    cmd: "podman inspect {{ item }} --format {% raw %}'{{.State.Running}}'{% endraw %}"
  loop: "{{ hc_containers }}"
  register: hc_container_state
  changed_when: false
  failed_when: false

- name: Record containers that are not running
  ansible.builtin.set_fact:
    hc_failures: "{{ hc_failures + ['Container not running: ' ~ item.item] }}"
  loop: "{{ hc_container_state.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: (item.stdout | default('') | trim) != 'true'

# ── Errata repo systemd unit ─────────────────────────────────────────────
- name: Check errata repo service
  ansible.builtin.systemd:
    name: dcc-errata-repo
  register: hc_errata
  failed_when: false

- name: Record errata repo service if not active
  ansible.builtin.set_fact:
    hc_failures: "{{ hc_failures + ['Service not active: dcc-errata-repo (state: ' ~ _hc_state ~ ')'] }}"
  vars:
    _hc_state: "{{ hc_errata.status.ActiveState | default('not found') }}"
  when: _hc_state != 'active'

# ── TCP reachability ─────────────────────────────────────────────────────
- name: Check TCP ports
  ansible.builtin.wait_for:
    host: "{{ item.host }}"
    port: "{{ item.port }}"
    timeout: "{{ hc_connect_timeout }}"
    state: started
  loop: "{{ hc_ports }}"
  loop_control:
    label: "{{ item.label }}"
  register: hc_port_state
  failed_when: false

- name: Record unreachable ports
  ansible.builtin.set_fact:
    hc_failures: "{{ hc_failures + ['Port unreachable: ' ~ item.item.label ~ ' (' ~ item.item.host ~ ':' ~ item.item.port ~ ')'] }}"
  loop: "{{ hc_port_state.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when: item.failed | default(false)

# ── HTTP health endpoints ────────────────────────────────────────────────
- name: Check HTTP health endpoints
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: GET
    validate_certs: "{{ hc_validate_certs }}"
    ca_path: "{{ hc_ca_path | default(omit, true) }}"
    timeout: "{{ hc_http_timeout }}"
    status_code: 200
  loop: "{{ hc_endpoints }}"
  loop_control:
    label: "{{ item.label }}"
  register: hc_endpoint_state
  changed_when: false
  failed_when: false

- name: Record failing health endpoints
  ansible.builtin.set_fact:
    hc_failures: >-
      {{ hc_failures + ['Health endpoint failed: ' ~ item.item.label
         ~ ' (' ~ item.item.url ~ ' -> ' ~ _hc_status ~ ')'] }}
  vars:
    _hc_status: "{{ item.status | default('no response') }}"
  loop: "{{ hc_endpoint_state.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when: (item.status | default(0)) != 200
